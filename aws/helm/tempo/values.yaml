
# GHS Tempo - Distributed Trace Storage
# Helm chart: grafana-community/tempo
# Chart version: 3.2.1

replicas: 1

tempo:
  retention: 168h

  reportingEnabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  size: 10Gi

tempoQuery:
  enabled: false

