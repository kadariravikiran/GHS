replicaCount: 2

image:
  repository: 872522504985.dkr.ecr.ap-south-1.amazonaws.com/ghs-app
  tag: "frontend-7b73e3975efec2fa9ec32e28fe0b02fd4283077f"
  pullPolicy: IfNotPresent

containerPort: 80

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
