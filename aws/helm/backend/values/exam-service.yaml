serviceName: exam-service

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

replicaCount: 1

image:
  repository: 872522504985.dkr.ecr.ap-south-1.amazonaws.com/ghs-app
  tag: "exam-service-1157a9ed0a71aa71963fa47334babd33262dd75e"
  pullPolicy: IfNotPresent

containerPort: 8086

service:
  type: ClusterIP
  port: 8086

database:
  enabled: true
  host: ghs-postgresql
  port: 5432
  name: exam_db
  usernameSecret:
    name: ghs-db-credentials
    key: EXAM_DB_USERNAME
  passwordSecret:
    name: ghs-db-credentials
    key: EXAM_DB_PASSWORD
