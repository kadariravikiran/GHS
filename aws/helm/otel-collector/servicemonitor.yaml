apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: ghs-otel-collector-application
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - monitoring

  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: ghs-otel-collector

  endpoints:
    - port: application-metrics
      path: /metrics
      interval: 30s
