replicaCount: 1

image:
  repository: postgres
  tag: "17"
  pullPolicy: IfNotPresent

auth:
  existingSecret: ghs-postgresql-secret
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD
  database: postgres

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  size: 20Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
