apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghs-postgresql
  labels:
    app.kubernetes.io/name: ghs-postgresql
spec:
  serviceName: ghs-postgresql-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ghs-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghs-postgresql
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
            - name: POSTGRES_DB
              value: {{ .Values.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: db-secrets
              mountPath: /run/db-secrets
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: init-scripts
          configMap:
            name: ghs-postgresql-init
            defaultMode: 0755
        - name: db-secrets
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            items:
              - key: AUTH_DB_PASSWORD
                path: AUTH_DB_PASSWORD
              - key: STUDENT_DB_PASSWORD
                path: STUDENT_DB_PASSWORD
              - key: TEACHER_DB_PASSWORD
                path: TEACHER_DB_PASSWORD
              - key: ATTENDANCE_DB_PASSWORD
                path: ATTENDANCE_DB_PASSWORD
              - key: FEE_DB_PASSWORD
                path: FEE_DB_PASSWORD
              - key: EXAM_DB_PASSWORD
                path: EXAM_DB_PASSWORD
              - key: HOMEWORK_DB_PASSWORD
                path: HOMEWORK_DB_PASSWORD
              - key: ANNOUNCEMENT_DB_PASSWORD
                path: ANNOUNCEMENT_DB_PASSWORD
              - key: GALLERY_DB_PASSWORD
                path: GALLERY_DB_PASSWORD
              - key: NOTIFICATION_DB_PASSWORD
                path: NOTIFICATION_DB_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
