
# GHS Loki - Centralized Logging
# Helm chart: grafana-community/loki
# Chart version: 21.4.2
# Loki version: 3.7.10

# Single-instance deployment
deploymentMode: Monolithic

# --------------------------------------------------
# Loki configuration
# --------------------------------------------------
loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # TSDB schema with filesystem object storage
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  # Log retention: 7 days
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h

  # Compactor handles retention and index compaction
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: filesystem

  server:
    http_listen_port: 3100

# --------------------------------------------------
# Single Binary Loki
# --------------------------------------------------
singleBinary:
  enabled: true
  replicas: 1

  persistence:
    enabled: true
    storageClass: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    enableStatefulSetAutoDeletePVC: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# --------------------------------------------------
# Disable Simple Scalable components
# --------------------------------------------------
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# --------------------------------------------------
# Disable unnecessary components
# --------------------------------------------------
gateway:
  enabled: false

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# --------------------------------------------------
# Rollout operator
# --------------------------------------------------
rollout_operator:
  enabled: false


