apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghs-monitoring
  namespace: argocd
spec:
  project: default

  sources:
    # Helm chart source
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/aws/helm/monitoring/values.yaml

    # Git repository containing our Helm values
    - repoURL: https://github.com/kadariravikiran/GHS.git
      targetRevision: qa
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
