apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ghs-postgresql
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/kadariravikiran/GHS.git
    targetRevision: qa
    path: aws/helm/postgresql
    helm:
      releaseName: ghs-postgresql

  destination:
    server: https://kubernetes.default.svc
    namespace: ghs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
