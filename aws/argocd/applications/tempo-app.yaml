
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ghs-tempo
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 3.2.1
      helm:
        releaseName: ghs-tempo
        valueFiles:
          - $values/aws/helm/tempo/values.yaml

    - repoURL: https://github.com/kadariravikiran/GHS.git
      targetRevision: qa
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

