apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ghs-aws-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/kadariravikiran/GHS.git
    targetRevision: qa
    path: aws/argocd/applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
