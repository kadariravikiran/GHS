serviceName: attendance-service
replicaCount: 1
image:
  repository: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/attendance-service
  tag: "928743fd66a43d89eb77609bcccac7aced0e7695"
  pullPolicy: IfNotPresent
containerPort: 8084
service:
  type: ClusterIP
  port: 8084
serviceAccount:
  create: false
  automount: false
  name: ghs-cloudsql-ksa
resources: {}
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
nodeSelector: {}
podAnnotations: {}
podLabels: {}

database:
  name: attendance_db
