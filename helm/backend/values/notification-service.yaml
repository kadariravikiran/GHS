serviceName: notification-service
replicaCount: 1
image:
  repository: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/notification-service
  tag: "e8d33290a2479fc14dc2f1f5b952efa12b2ca3bc"
  pullPolicy: IfNotPresent
containerPort: 8090
service:
  type: ClusterIP
  port: 8090
serviceAccount:
  create: false
  automount: false
  name: ghs-cloudsql-ksa
resources: {}
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
nodeSelector: {}
podAnnotations: {}
podLabels: {}

database:
  name: notification_db
