apiVersion: apps/v1
kind: Deployment

metadata:
  name: ghs-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ghs-frontend

  template:
    metadata:
      labels:
        app: ghs-frontend

    spec:
      containers:
        - name: frontend
          image: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/frontend:d2293207fb749a14a235d075c45f77b8160d3c9d
          ports:
            - containerPort: 80
