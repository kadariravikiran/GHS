apiVersion: apps/v1
kind: Deployment

metadata:
  name: ghs-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ghs-frontend

  template:
    metadata:
      labels:
        app: ghs-frontend

    spec:
      containers:
        - name: frontend
          image: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/frontend:bd5368beac5c6335de9b12f2f54b2b02185962e3
          ports:
            - containerPort: 80
