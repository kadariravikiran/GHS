apiVersion: apps/v1
kind: Deployment

metadata:
  name: ghs-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ghs-frontend

  template:
    metadata:
      labels:
        app: ghs-frontend

    spec:
      containers:
        - name: frontend
          image: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/frontend:dce3850fef88b82c9387712678dabcb1fb16a6c1
          ports:
            - containerPort: 80
