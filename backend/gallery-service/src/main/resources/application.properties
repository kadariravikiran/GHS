spring.application.name=gallery-service
server.port=8090
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gallery_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:change-this-development-secret-key-32chars}
management.endpoints.web.exposure.include=health,info
