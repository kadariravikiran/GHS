name: GHS

on:
  push:
    branches:
      - dev
      - qa
      - production

  pull_request:
    branches:
      - dev
      - qa
      - production

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up java 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test all backend services
        run: |
          for service in backend/*-service; do
            echo "Testing $service"
            mvn -f "$service/pom.xml" clean test
          done

      - name: Package all backend services
        run: |
          for service in backend/*-service; do
            echo "Packaging $service"
            mvn -f "$service/pom.xml" package -DskipTests
          done

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            backend/*/target/*.jar 

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/ 
