name: GHS

on:
  push:
    branches:
      - dev
      - qa
      - production

  pull_request:
    branches:
      - dev
      - qa
      - production

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test all backend services
        run: |
          for service in backend/*-service; do
            echo "Testing $service"
            mvn -f "$service/pom.xml" clean test
          done

      - name: Package all backend services
        run: |
          for service in backend/*-service; do
            echo "Packaging $service"
            mvn -f "$service/pom.xml" package -DskipTests
          done

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            backend/*/target/*.jar

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-and-push:
    if: github.event_name == 'push'
    needs:
      - backend-ci
      - frontend-ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: backend

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/887456464145/locations/global/workloadIdentityPools/ghs-pool/providers/githubactions'
          service_account: 'ghs-github-actions@project-b1401e3c-6c22-44e2-ba6.iam.gserviceaccount.com'

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build backend Docker images
        run: |
          for service in backend/*-service; do
            echo "Building Docker image for $service"
            docker build \
              -t "asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/$(basename "$service"):${{ github.sha }}" \
              "$service"
          done

      - name: Build frontend Docker image
        run: |
          docker build \
            -t "asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/frontend:${{ github.sha }}" \
            frontend

      - name: Push backend Docker images
        run: |
          for service in backend/*-service; do
            IMAGE="asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/$(basename "$service"):${{ github.sha }}"
            echo "Pushing $IMAGE"
            docker push "$IMAGE"
          done

      - name: Push frontend Docker image
        run: |
          IMAGE="asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo/frontend:${{ github.sha }}"
          echo "Pushing $IMAGE"
          docker push "$IMAGE"


  update-image-tags:
    if: github.event_name == 'push'
    needs:
      - build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update backend Helm image tags
        run: |
          for file in helm/backend/values/*.yaml; do
            sed -i 's/^  tag: .*/  tag: "${{ github.sha }}"/' "$file"
            echo "Updated $file"
          done

      - name: Update frontend Helm image tag
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ github.sha }}"/' \
            helm/ghs-frontend/values.yaml

      - name: Verify updated image tags
        run: |
          echo "Backend image tags:"
          grep -Hn '^[[:space:]]*tag:' helm/backend/values/*.yaml

          echo "Frontend image tag:"
          grep -n '^[[:space:]]*tag:' helm/ghs-frontend/values.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated Helm values
        run: |
          git add helm/backend/values/*.yaml helm/ghs-frontend/values.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi

          git commit -m "chore: update Helm image tags to ${{ github.sha }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

