
name: GHS

on:
  push:
    branches:
      - main
      - dev
      - qa
      - production

  pull_request:
    branches:
      - main
      - dev
      - qa
      - production

jobs:

  # ==========================================
  # BACKEND CI - 10 MICROSERVICES
  # ==========================================

  backend-ci:
    name: Backend CI - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - announcement-service
          - attendance-service
          - auth-service
          - exam-service
          - fee-service
          - gallery-service
          - homework-service
          - notification-service
          - student-service
          - teacher-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test microservice
        run: |
          echo "Testing ${{ matrix.service }}"
          mvn -f "backend/${{ matrix.service }}/pom.xml" clean test

      - name: Package microservice
        run: |
          echo "Packaging ${{ matrix.service }}"
          mvn -f "backend/${{ matrix.service }}/pom.xml" package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/*.jar
          if-no-files-found: error


  # ==========================================
  # FRONTEND CI
  # ==========================================

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error


  # ==========================================
  # GCP BUILD AND PUSH
  # Runs on dev, qa and production
  # ==========================================

  build-and-push-gcp:
    name: Build and Push Images to GCP

    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/qa' ||
        github.ref == 'refs/heads/production'
      )

    needs:
      - backend-ci
      - frontend-ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      GCP_REGISTRY: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/ghs-repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: backend-artifacts

      - name: Restore backend JAR files
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do
            artifact_dir="backend-artifacts/backend-${service}"

            mkdir -p "backend/${service}/target"

            echo "Restoring ${service}"

            cp "${artifact_dir}/"*.jar "backend/${service}/target/"
          done

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/887456464145/locations/global/workloadIdentityPools/ghs-pool/providers/githubactions'
          service_account: 'artifact-service@project-b1401e3c-6c22-44e2-ba6.iam.gserviceaccount.com'

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push backend images to GCP
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do
            IMAGE="${GCP_REGISTRY}/${service}:${GITHUB_SHA}"

            echo "Building ${IMAGE}"

            docker build -t "${IMAGE}" "backend/${service}"

            echo "Pushing ${IMAGE}"

            docker push "${IMAGE}"
          done

      - name: Build and push frontend image to GCP
        run: |
          IMAGE="${GCP_REGISTRY}/frontend:${GITHUB_SHA}"

          docker build -t "${IMAGE}" frontend

          docker push "${IMAGE}"


  # ==========================================
  # AWS BUILD AND PUSH
  # Runs on main, dev, qa and production
  # ==========================================

  build-and-push-aws:
    name: Build and Push Images to AWS ECR

    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/qa' ||
        github.ref == 'refs/heads/production' ||
        github.ref == 'refs/heads/dev'
      )

    needs:
      - backend-ci
      - frontend-ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: '872522504985'
      ECR_REPOSITORY: ghs-app
      ECR_REGISTRY: 872522504985.dkr.ecr.ap-south-1.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: backend-artifacts

      - name: Restore backend JAR files
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do
            artifact_dir="backend-artifacts/backend-${service}"

            mkdir -p "backend/${service}/target"

            echo "Restoring ${service}"

            cp "${artifact_dir}/"*.jar "backend/${service}/target/"
          done

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # AWS OIDC authentication

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872522504985:role/GitHubActions-GHS-ECR-Role
          aws-region: ap-south-1
          role-session-name: GitHubActionsGHS

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Authenticate Docker to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build backend images

      - name: Build backend Docker images
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do

            SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-${GITHUB_SHA}"

            LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-latest"

            echo "Building ${SHA_IMAGE}"

            docker build -t "${SHA_IMAGE}" "backend/${service}"

            docker tag "${SHA_IMAGE}" "${LATEST_IMAGE}"

          done

      # Build frontend image

      - name: Build frontend Docker image
        run: |
          SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-${GITHUB_SHA}"

          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-latest"

          docker build -t "${SHA_IMAGE}" frontend

          docker tag "${SHA_IMAGE}" "${LATEST_IMAGE}"

      # Push backend images

      - name: Push backend images to AWS ECR
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do

            SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-${GITHUB_SHA}"

            LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-latest"

            echo "Pushing ${SHA_IMAGE}"

            docker push "${SHA_IMAGE}"

            echo "Pushing ${LATEST_IMAGE}"

            docker push "${LATEST_IMAGE}"

          done

      # Push frontend image

      - name: Push frontend images to AWS ECR
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-${GITHUB_SHA}"

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-latest"


  # ==========================================
  # UPDATE GCP HELM IMAGE TAGS
  # Only after successful GCP publishing
  # ==========================================

  update-gcp-image-tags:
    name: Update GCP Helm Image Tags

    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/qa' ||
        github.ref == 'refs/heads/production'
      )

    needs:
      - build-and-push-gcp

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update backend GCP Helm image tags
        shell: bash
        run: |
          for file in helm/backend/values/*.yaml; do

            sed -i 's/^  tag: .*/  tag: "${{ github.sha }}"/' "$file"

            echo "Updated GCP values: ${file}"

          done

      - name: Update frontend GCP Helm image tag
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ github.sha }}"/' helm/ghs-frontend/values.yaml

      - name: Verify GCP Helm image tags
        run: |
          grep -Hn '^[[:space:]]*tag:' helm/backend/values/*.yaml

          grep -n '^[[:space:]]*tag:' helm/ghs-frontend/values.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated GCP Helm values
        shell: bash
        run: |
          git add helm/backend/values/*.yaml

          git add helm/ghs-frontend/values.yaml

          if git diff --cached --quiet; then
            echo "No GCP Helm image tag changes"
            exit 0
          fi

          git commit -m "chore: update GCP Helm image tags to ${GITHUB_SHA} [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"

