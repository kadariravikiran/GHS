
name: GHS

on:
  push:
    branches:
      - main
      - dev
      - qa
      - production

  pull_request:
    branches:
      - main
      - dev
      - qa
      - production

jobs:

  # ==========================================
  # JOB 1: BACKEND CI
  # ==========================================

  backend-ci:
    name: Backend CI - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        service:
          - announcement-service
          - attendance-service
          - auth-service
          - exam-service
          - fee-service
          - gallery-service
          - homework-service
          - notification-service
          - student-service
          - teacher-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test microservice
        run: |
          echo "Testing ${{ matrix.service }}"

          mvn -f "backend/${{ matrix.service }}/pom.xml" clean test

      - name: Package microservice
        run: |
          echo "Packaging ${{ matrix.service }}"

          mvn -f "backend/${{ matrix.service }}/pom.xml" package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/*.jar
          if-no-files-found: error


  # ==========================================
  # JOB 2: FRONTEND CI
  # ==========================================

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error


  # ==========================================
  # JOB 3: BUILD AND PUSH TO AWS ECR
  # ==========================================

  build-and-push-aws:
    name: Build and Push Images to AWS ECR

    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/qa' ||
        github.ref == 'refs/heads/production' ||
        github.ref == 'refs/heads/dev'
      )

    needs:
      - backend-ci
      - frontend-ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: '872522504985'
      ECR_REPOSITORY: ghs-app
      ECR_REGISTRY: 872522504985.dkr.ecr.ap-south-1.amazonaws.com

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------
      # Download backend artifacts
      # --------------------------------------

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: backend-artifacts

      - name: Restore backend JAR files
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do

            artifact_dir="backend-artifacts/backend-${service}"

            mkdir -p "backend/${service}/target"

            echo "Restoring JAR for ${service}"

            cp "${artifact_dir}/"*.jar "backend/${service}/target/"

          done


      # --------------------------------------
      # Download frontend artifacts
      # --------------------------------------

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist


      # --------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872522504985:role/GitHubActions-GHS-ECR-Role
          aws-region: ap-south-1
          role-session-name: GitHubActionsGHS

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------
      # Authenticate Docker with ECR
      # --------------------------------------

      - name: Authenticate Docker to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------
      # Build backend Docker images
      # --------------------------------------

      - name: Build backend Docker images
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do

            SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-${GITHUB_SHA}"

            LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-latest"

            echo "Building ${SHA_IMAGE}"

            docker build -t "${SHA_IMAGE}" "backend/${service}"

            docker tag "${SHA_IMAGE}" "${LATEST_IMAGE}"

          done


      # --------------------------------------
      # Build frontend Docker image
      # --------------------------------------

      - name: Build frontend Docker image
        run: |
          SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-${GITHUB_SHA}"

          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-latest"

          docker build -t "${SHA_IMAGE}" frontend

          docker tag "${SHA_IMAGE}" "${LATEST_IMAGE}"


      # --------------------------------------
      # Push backend images to ECR
      # --------------------------------------

      - name: Push backend images to AWS ECR
        shell: bash
        run: |
          services=(
            announcement-service
            attendance-service
            auth-service
            exam-service
            fee-service
            gallery-service
            homework-service
            notification-service
            student-service
            teacher-service
          )

          for service in "${services[@]}"; do

            SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-${GITHUB_SHA}"

            LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}-latest"

            echo "Pushing ${SHA_IMAGE}"

            docker push "${SHA_IMAGE}"

            echo "Pushing ${LATEST_IMAGE}"

            docker push "${LATEST_IMAGE}"

          done


      # --------------------------------------
      # Push frontend images to ECR
      # --------------------------------------

      - name: Push frontend images to AWS ECR
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-${GITHUB_SHA}"

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:frontend-latest"

